<!doctype html>
<html lang="id" data-lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6efdf">
  <meta name="description" content="{{ page.description | default: page.title | escape }}">
  <title>{{ page.title | escape }} — TukangPLC</title>
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
</head>
<body data-page="post">
  <header class="topbar">
    <div class="shell nav">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="TukangPLC, beranda">
        <img src="https://avatars.githubusercontent.com/u/67008023?v=4" alt="Logo TukangPLC">
        <span class="brand-word">Tukang<span>PLC</span></span>
      </a>
      <nav class="navlinks" aria-label="Navigasi utama">
        <a href="{{ '/' | relative_url }}#tutorial" data-id="Tutorial" data-en="Tutorial">Tutorial</a>
        <a href="{{ '/' | relative_url }}#artikel" data-id="Artikel" data-en="Articles">Artikel</a>
        <a href="{{ '/' | relative_url }}#tentang" data-id="Tentang" data-en="About">Tentang</a>
        <a href="{{ '/' | relative_url }}#kontak" data-id="Kontak" data-en="Contact">Kontak</a>
      </nav>
      <div class="navtools">
        <button class="lang" id="langToggle" type="button" aria-label="Switch to English">EN</button>
        <a class="contact-link" href="{{ '/' | relative_url }}#kontak" data-id="Sapa TukangPLC" data-en="Say hello">Sapa TukangPLC</a>
      </div>
    </div>
  </header>
  <main class="shell post-shell">
    <a class="back-link" href="{{ '/' | relative_url }}#artikel" data-id="← Kembali ke artikel" data-en="← Back to articles">← Kembali ke artikel</a>
    <article>
      <div class="post-meta">{{ page.date | date: "%d %B %Y" }}</div>
      <h1>{{ page.title | escape }}</h1>
      {% if page.description %}<p class="post-description">{{ page.description | escape }}</p>{% endif %}
      <div class="article-body">{{ content }}</div>
    </article>
  </main>
  <footer><div class="shell footer-inner"><span>© <span id="year"></span> TukangPLC</span><span class="fine">Proyek edukasi independen.</span></div></footer>
  <script src="{{ '/assets/site.js' | relative_url }}" defer></script>
</body>
</html>
